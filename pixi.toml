[workspace]
requires-pixi = ">=0.84.2"
preview = ["pixi-build"]

channels = ["https://repo.prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64"]

[workspace.exclude-newer]
cutoff = "8d"

[workspace.exclude-newer.exemptions]
# from Mira sources
geoh5py = "*"
las-geoh5 = "*"
mira-omf = "*"

[workspace.pypi-exclude-newer.exemptions]
# from Mira sources
geoh5py = "*"
las-geoh5 = "*"
mira-omf = "*"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "*"
channels = ["https://repo.prefix.dev/conda-forge"]

[package.build.config]
experimental = true

[activation.env]
PYTHONNOUSERSITE = "1"

[dependencies]
# no default Conda dependencies. See features "mira-conda" and "conda-rt"

[pypi-dependencies]
# no default PyPI dependencies. See feature "mira-pypi"

[environments]
default = { features = ["py-default", "dev", "mira-conda", "mira-channels", "conda-rt", "test", "lint"], solve-group = "default" }
# Test published PyPI and Conda packages in separate solve groups.
pypi-mira = { features = ["py-default", "mira-pypi", "mira-pypi-index", "conda-rt", "test", "lint"], solve-group = "pypi-default" }
pypi-mira-py313 = { features = ["py313", "mira-pypi", "mira-pypi-index", "conda-rt", "test", "lint"], solve-group = "pypi-py313" }
pypi-mira-py314 = { features = ["py314", "mira-pypi", "mira-pypi-index", "conda-rt", "test", "lint"], solve-group = "pypi-py314" }

conda-mira = { features = ["py-default", "mira-conda", "mira-channels", "conda-rt", "test", "lint"], solve-group = "default"}
conda-mira-py313 = { features = ["py313", "mira-conda", "mira-channels", "conda-rt", "test", "lint"], solve-group = "py313"}
conda-mira-py314 = { features = ["py314", "mira-conda", "mira-channels", "conda-rt", "test", "lint"], solve-group = "py314"}

# the environments for distribution, with no dev, lint or test dependencies
pypi-mira-rt = { features = ["py-default", "mira-pypi", "mira-pypi-index", "conda-rt"], solve-group = "pypi-default" }
pypi-mira-rt-py314 = { features = ["py314", "mira-pypi", "mira-pypi-index", "conda-rt"], solve-group = "pypi-py314" }
conda-mira-rt = { features = ["py-default", "mira-conda", "mira-channels", "conda-rt"], solve-group = "default"}
conda-mira-rt-py314 = { features = ["py314", "mira-conda", "mira-channels", "conda-rt"], solve-group = "py314"}

# can only use this environment once Mira dependencies are published on PyPI
# pypi-rt = ["py-default", "mira-pypi", "conda-rt"]

# can only use this environment once Mira dependencies are published on conda-forge
# conda-rt = ["py-default", "mira-conda", "conda-rt"]

pylint-only = {features = ["py-default", "test", "lint"], no-default-feature = true}

[feature.py-default.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.mira-pypi-index.pypi-options]
# private PyPI index still needed to resolve non-published versions and unify with Conda packages
# Authenticate for this private PyPI index first; see README-dev.rst.
extra-index-urls = [
    "https://mirageoscienceltd.jfrog.io/artifactory/api/pypi/public-pypi-dev-local/simple"
]

[feature.mira-channels]
# Authenticate for this private Conda channel first; see README-dev.rst.
channels = [
    "https://mirageoscienceltd.jfrog.io/artifactory/api/conda/public-noremote-conda-dev",
]

[feature.mira-conda.dependencies]
geoh5py = ">=0.14.0b1, 0.14.*"
las-geoh5 = ">=0.3.4b1, 0.3.*"
mira-omf = ">=3.5.0b1, 3.5.*"

[feature.mira-pypi.pypi-dependencies]
geoh5py = ">=0.14.0b1, ==0.14.*"
# geoh5py = { git = "https://github.com/MiraGeoscience/geoh5py.git", rev = "release/ga-4.9" }
las-geoh5 = ">=0.3.4b1, ==0.3.*"
# las-geoh5 = { git = "https://github.com/MiraGeoscience/las-geoh5.git", rev = "release/ga-4.9" }
mira-omf = ">=3.5.0b1, ==3.5.*"
# mira-omf = { git = "https://github.com/MiraGeoscience/omf.git", rev = "release/ga-4.9" }

[feature.conda-rt.dependencies]
# runtime dependencies, except Mira packages
# (None)

[feature.dev.dependencies]
docutils = "*"
ipython = "*"
pixi-pycharm = "*"
pygments = "*"

[feature.dev.tasks]
repl = {description = "Launch interactive Python shell (IPython)", cmd = "ipython"}

[feature.test.dependencies]
packaging = "*"
pytest = "*"
pytest-cov = "*"
pyyaml = "*"

[feature.lint.dependencies]
pylint = "4.*"

[feature.lint.tasks]
lint = {cmd = "pylint", description = "Run pylint"}

[feature.test.tasks]
test = {cmd = "python -m pytest --cov --cov-report=xml", description = "Run pytest with coverage reporting"}

[tasks]
install = {cmd = "uv pip install --python \"$CONDA_PREFIX\" --no-deps --editable . && python scripts/check_dependencies.py", description = "Install the local package and check dependency compatibility"}

[tasks.test-pyvers]
description = "Run tests across all Python versions"
depends-on = [
    {task = "test", environment = "pypi-mira"},
    {task = "test", environment = "pypi-mira-py313"},
    {task = "test", environment = "pypi-mira-py314"},
    {task = "test", environment = "conda-mira"},
    {task = "test", environment = "conda-mira-py313"},
    {task = "test", environment = "conda-mira-py314"},
]
