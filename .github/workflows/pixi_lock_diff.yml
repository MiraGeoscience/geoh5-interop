name: Pixi lock diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
    paths:
      - pixi.lock

permissions: {}

jobs:
  call-workflow-pixi-lock-diff:
    name: Pixi lock diff
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pixi-lock_diff.yml@9e46551783cee8a8c2c7a30794af4b98e2671729 # v3.13.6
    permissions:
      contents: read
      pull-requests: write
