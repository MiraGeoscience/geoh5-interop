name: Pixi lock diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
    paths:
      - pixi.lock

permissions: {}

jobs:
  call-workflow-pixi-lock-diff:
    name: Pixi lock diff
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pixi-lock_diff.yml@4a000ba323d8818b874c907dd7cfb3b29960cba4 # v4.1.0
    permissions:
      contents: read
      pull-requests: write
