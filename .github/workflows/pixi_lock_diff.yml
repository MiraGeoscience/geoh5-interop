name: Pixi lock diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
    paths:
      - pixi.lock

permissions: {}

jobs:
  call-workflow-pixi-lock-diff:
    name: Pixi lock diff
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pixi-lock_diff.yml@edb72d7524d25db3b4eb976890eb6837a8eb39f8 # v4.0.1
    permissions:
      contents: read
      pull-requests: write
