name: Pixi lock diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
    paths:
      - pixi.lock

permissions: {}

jobs:
  call-workflow-pixi-lock-diff:
    name: Pixi lock diff
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pixi-lock_diff.yml@40e4f41b8195844608f93eb613ce4ce8a0a1b76e # v4.0.0
    permissions:
      contents: read
      pull-requests: write
